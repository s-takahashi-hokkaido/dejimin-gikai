name: Deploy VPS

# さくらVPS へ web・admin を配る（手順書 docs/20260930_2104_さくらVPS構築手順.md 手順10）。
#
# 本番に出すのは main だけ。develop の変更は develop → main の PR（/deploy）をマージしてから、
# main を指定して手動で実行する（順番は手順書 §5「デプロイ」）。
#
# main 以外を止めるのは指定違いを防ぐため。このファイル自体は他のブランチでも書き換えられ、
# デプロイ鍵は repository の Secrets なので、権限の制限にはならない。
# 本当に main だけにするなら、Environment にブランチの制限を掛けて鍵をそちらに移す（リリース手順 §6）。
#
# 手動実行のみにしているのは、マイグレーションや infra/ の更新を先に済ませてから流すため。
# main への push で自動デプロイにする場合は、下の push を有効にする
# （rsync と再起動の間は 502 になるので、公開後に入れるかどうかを判断する）。
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

# 2つ同時に流れると rsync と restart が衝突するので直列化する
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # NEXT_PUBLIC_* はビルド時に JS へ埋め込まれるので、本番の値をここで渡す（手順書 手順10）。
    # anon キーは公開して構わない値なので Secrets ではなく Variables に置く。
    # サービスロールキー・OpenAI のキーなどの秘密は VPS の env ファイルにだけ置き、
    # ビルドでは使わない（ビルド時に DB へ接続する箇所が無いことを確認済み）。
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_WEB_URL: ${{ vars.NEXT_PUBLIC_WEB_URL }}
      # web は読まないが、参照が増えた時に取りこぼさないよう両方のビルドに渡す
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

    steps:
      # ブランチの指定違いで本番に別のコードが乗るのを防ぐ（main ブランチ以外は止める）。
      # GITHUB_REF_NAME だと main という名前のタグでも通ってしまうので、GITHUB_REF で比べる。
      # 登録漏れも、checkout やビルドの前にここで落とす（一覧は infra/README.md）
      - name: Check deploy ref, variables and secrets
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "デプロイできるのは main ブランチだけです（指定: ${GITHUB_REF}）" >&2
            echo "develop の変更は develop → main の PR をマージしてから、main を指定して実行してください" >&2
            exit 1
          fi

          missing=""
          for name in VPS_HOST VPS_USER \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
            NEXT_PUBLIC_WEB_URL NEXT_PUBLIC_APP_URL \
            VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "GitHub に登録されていません:${missing}" >&2
            echo "infra/README.md の「GitHub 側に登録するもの」を参照してください。" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10

      # VPS の実行環境と揃える（手順書 手順5）。バージョンは .node-version が唯一の出どころ
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter web build

      - name: Build admin
        run: pnpm --filter admin build

      # standalone には .next/static と public が入らないので手でコピーする
      # （検証結果 §4-6、検証手順 §3 手順4）。
      # モノレポなので server.js は .next/standalone/<app>/server.js に出る
      - name: Copy static assets into standalone output
        run: |
          cp -r web/.next/static web/.next/standalone/web/.next/static
          cp -r web/public web/.next/standalone/web/public
          cp -r admin/.next/static admin/.next/standalone/admin/.next/static
          cp -r admin/public admin/.next/standalone/admin/public

      - name: Set up SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ホスト鍵を固定する（StrictHostKeyChecking=no にしない）
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # 以降の ssh / rsync で使い回す。1か所で直せるようにここで決める
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -p ${VPS_SSH_PORT}" >> "$GITHUB_ENV"

      # 末尾の / は「ディレクトリの中身を送る」意味。外すと /srv/gikai/web/standalone/ になる。
      # --delete で、消えたファイルが VPS に残らないようにする
      # （runtime に作られる .next/cache も消えるが、ビルドが変わればキャッシュは無効なので問題ない）。
      # pnpm の node_modules は symlink だらけ。今は全て standalone の中を指す相対リンクだが、
      # 外を指すものが出た時に壊れたリンクを送らないよう --copy-unsafe-links を付ける。
      #
      # 注意: 転送の間、古いプロセスは差し替え中のファイルを読むので、一時的に 500 が出ることがある。
      # 失敗した時に戻す版も残らない（infra/README.md「デプロイ中の見え方」）
      - name: Deploy with rsync
        run: |
          rsync -az --delete --copy-unsafe-links -e "ssh ${SSH_OPTS}" \
            web/.next/standalone/ "${VPS_USER}@${VPS_HOST}:/srv/gikai/web/"
          rsync -az --delete --copy-unsafe-links -e "ssh ${SSH_OPTS}" \
            admin/.next/standalone/ "${VPS_USER}@${VPS_HOST}:/srv/gikai/admin/"

      # sudoers（infra/sudoers/gikai-deploy）で、このコマンドだけを NOPASSWD で許している
      - name: Restart services
        run: |
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" \
            'sudo /usr/bin/systemctl restart gikai-web gikai-admin'

      # Type=simple なので is-active は「listen した」ことを表さない。応答が返るまで待つ。
      # ポートは /srv/gikai/<app>.env の PORT（= unit が読む値）から取り、ここには持たない。
      # このチェックはホストの nginx を通らないので、Basic 認証の 401 は起こらない。
      # 4xx はデプロイが壊れている印なので失敗させる
      - name: Verify services are up
        run: |
          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" '
            set -e
            for app in web admin; do
              port=$(sed -n "s/^PORT=//p" "/srv/gikai/${app}.env" | tail -n 1)
              if [ -z "${port}" ]; then
                echo "/srv/gikai/${app}.env に PORT がありません" >&2
                exit 1
              fi
              if ! systemctl is-active --quiet "gikai-${app}"; then
                echo "gikai-${app} が起動していません" >&2
                systemctl status --no-pager -n 20 "gikai-${app}" || true
                exit 1
              fi
              ok=""
              i=0
              while [ "${i}" -lt 30 ]; do
                code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" "http://127.0.0.1:${port}/" || true)
                case "${code}" in
                  2*|3*) ok=1; break ;;
                esac
                i=$((i + 1))
                sleep 2
              done
              if [ -z "${ok}" ]; then
                echo "gikai-${app} (127.0.0.1:${port}) が応答しません（最後の HTTP コード: ${code}）" >&2
                systemctl status --no-pager -n 20 "gikai-${app}" || true
                exit 1
              fi
              echo "gikai-${app} OK (127.0.0.1:${port} -> ${code})"
            done
          '

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
