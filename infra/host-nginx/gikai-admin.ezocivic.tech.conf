# admin（管理画面 Next.js）の vhost。gikai-admin.ezocivic.tech → 127.0.0.1:3003（systemd の gikai-admin）
#
# 置き場所と TLS の当て方: infra/host-nginx/README.md
# 手順: docs/20260930_2104_さくらVPS構築手順.md 手順9
#
# TLS はここには書かない。`certbot --nginx` が後から
# `listen 443 ssl` / `ssl_certificate` / http から https への転送をこのファイルに書き込む。
# それまでは 80 番だけで待ち受ける（証明書がまだ無い状態でも `nginx -t` が通るようにするため）。

server {
  listen 80;
  # IPv6 で待ち受けるかは公開前に決める（構築手順 手順6・§8 の未決事項）。
  # 有効にする時は 3 つの vhost すべてでこの行を外し、DNS に AAAA レコードを足す
  # （nginx を先に直さずに AAAA だけ足すと、IPv6 で来た利用者が繋がらない）
  # listen [::]:80;

  server_name gikai-admin.ezocivic.tech;

  # ---- 公開前の Basic 認証（公開する時に、この下の 2 行を消して reload する）----
  auth_basic "EZO CIVIC (preview)";
  auth_basic_user_file /etc/nginx/htpasswd-gikai;
  # ---- 消すのはここまで（server ブロック全体にかけている。管理画面自体のログインとは別の、
  #      公開前に関係者以外を入れないための蓋）----

  # Let's Encrypt の http-01 は Basic 認証の外に出す。
  # `certbot --nginx` は自前の server ブロックで応答するのでここは通らないが、
  # webroot 方式に切り替えた時に 401 で失敗しないようにしておく
  location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/html;
  }

  location / {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # 利用者が送ってきた X-Real-IP / X-Forwarded-For は信じずに $remote_addr で上書きする
    # （$proxy_add_x_forwarded_for を使わない）。この 2 つは compose の nginx が
    # 利用者の IP として信じる値で、偽れると匿名ログインのレート制限を逃れられる
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 管理画面も AI の応答（議案の解説生成など）をストリーミングで返すので、nginx で溜めない
    proxy_buffering off;
    # 最初のトークンが出るまで既定の 60 秒を超えることがある
    proxy_read_timeout 300s;
  }
}
