# Supabase（compose の nginx）の vhost。db.ezocivic.tech → 127.0.0.1:8000
#
# 置き場所と TLS の当て方: infra/host-nginx/README.md
# 手順: docs/20260924_1404_さくらVPS立ち上げ手順.md 手順9
#
# TLS はここには書かない。`certbot --nginx` が後から
# `listen 443 ssl` / `ssl_certificate` / http から https への転送をこのファイルに書き込む。
# それまでは 80 番だけで待ち受ける（証明書がまだ無い状態でも `nginx -t` が通るようにするため）。

server {
  listen 80;
  # IPv6 で待ち受けるかは公開前に決める（手順書 手順6・§7 の未決事項）。
  # 有効にする時は 3 つの vhost すべてでこの行を外し、DNS に AAAA レコードを足す
  # （nginx を先に直さずに AAAA だけ足すと、IPv6 で来た利用者が繋がらない）
  # listen [::]:80;

  server_name db.ezocivic.tech;

  # ここには Basic 認証をかけない。ブラウザの supabase-js は別オリジンの API に
  # 認証情報を付けないので、かけると web・admin の画面から Supabase を呼べなくなる。
  # db 側は RLS（ポリシー無し＝全拒否）で守られていて、anon キーでは何も読めない（検証結果 §3 #8）

  # 議案サムネイルのアップロード（storage-api の FILE_SIZE_LIMIT も 50MB）
  client_max_body_size 50m;

  # Let's Encrypt の http-01 用。`certbot --nginx` は自前の server ブロックで応答するので
  # ここは通らないが、webroot 方式に切り替えた時に上流へ流れないようにしておく
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # 利用者が送ってきた X-Real-IP / X-Forwarded-For は信じずに $remote_addr で上書きする
    # （$proxy_add_x_forwarded_for を使わない）。compose の nginx は
    # ここから来た X-Real-IP を利用者の IP として信じ（set_real_ip_from 10.203.0.1）、
    # GoTrue の匿名ログインのレート制限（GOTRUE_RATE_LIMIT_HEADER）をその IP ごとに数える。
    # 上書きしないと、利用者が偽の IP を名乗って制限を逃れられる
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # compose の nginx は http で受けるので、https だったことはこのヘッダーでしか伝わらない
    # （storage-api が返す URL の組み立てに使われる）
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
