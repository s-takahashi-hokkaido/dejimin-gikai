# Supabase の API ゲートウェイ（公式 compose の Envoy / Kong）の代わり。パスを振り分けるだけ。
# apikey の検査はしない。apikey も JWT も無いリクエストは PostgREST で anon 扱いになり、
# RLS（ポリシー無し＝全拒否）で何も返らない。
server {
  listen 8000;
  client_max_body_size 50m;

  proxy_set_header Host $host;
  # 利用者が送ってきた値に追記せず $remote_addr で上書きする。
  # 偽の IP を名乗って GoTrue のレート制限（GOTRUE_RATE_LIMIT_HEADER）を逃れるのを防ぐため
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # rest と auth は CORS を自前で返す（auth は GOTRUE_CORS_ALLOWED_HEADERS で apikey を許可済み）
  location /rest/v1/    { proxy_pass http://rest:3000/; }
  location /auth/v1/    { proxy_pass http://auth:9999/; }

  # storage-api は CORS に応答しないので、ここで返す（公式構成ではゲートウェイの役目）。
  # admin のサムネイルアップロードがブラウザから直接ここを叩く
  location /storage/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin * always;
    proxy_pass http://storage:5000/;
  }
}
