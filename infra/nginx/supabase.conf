# Supabase の API ゲートウェイ（公式 compose の Envoy / Kong）の代わり。パスを振り分けるだけ。
# apikey の検査はしない。apikey も JWT も無いリクエストは PostgREST で anon 扱いになり、
# RLS（ポリシー無し＝全拒否）で何も返らない。

# サービスのコンテナが作り直されて IP が変わっても追従するよう、docker の DNS で引き直す
resolver 127.0.0.11 valid=10s ipv6=off;

upstream rest {
  zone rest 64k;
  server rest:3000 resolve;
  keepalive 16;
}

upstream auth {
  zone auth 64k;
  server auth:9999 resolve;
  keepalive 16;
}

upstream storage {
  zone storage 64k;
  server storage:5000 resolve;
  keepalive 16;
}

# storage-api が自分の URL（TUS の Location など）を組み立てる時に使う（REQUEST_ALLOW_X_FORWARDED_PATH）。
# 空のときはヘッダー自体が送られない
map $uri $forwarded_prefix {
  ~^/storage/v1/ /storage/v1;
  default "";
}

# ホストの nginx（TLS を受ける）が付けた X-Forwarded-Proto を引き継ぐ。ここは http で受けるので $scheme は常に http。
# 信じるのはゲートウェイ（下の set_real_ip_from と同じ IP）から来た http / https だけで、それ以外は $scheme
map $realip_remote_addr $from_host_proxy {
  10.203.0.1 1;
  default    0;
}

map "$from_host_proxy:$http_x_forwarded_proto" $forwarded_proto {
  ~^1:(?<proto>https?)$ $proto;
  default               $scheme;
}

server {
  listen 8000;
  client_max_body_size 50m;

  # ホストの nginx から来た通信は、コンテナからは docker のゲートウェイ（compose.yml で固定した 10.203.0.1）が
  # 送り元に見える。このままでは全員が同じ IP として数えられ、サイト全体で匿名ログインが1時間30件で止まるので、
  # ゲートウェイから来た時だけ、ホストの nginx が付けた X-Real-IP を $remote_addr にする。
  # それ以外の送り元（compose 内の別コンテナなど）が付けた X-Real-IP は無視する。
  # ホストの 127.0.0.1 に来た通信はすべてゲートウェイから来るので、ホストの nginx は X-Real-IP を必ず上書きすること。
  # ループバック（127.0.0.1）は入れない。ホストのループバックとコンテナのものは別で、ここには届かない
  set_real_ip_from 10.203.0.1;
  real_ip_header X-Real-IP;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  # 利用者が送ってきた値に追記せず $remote_addr（上の set_real_ip_from で決まった利用者の IP）で上書きする。
  # 偽の IP を名乗って GoTrue のレート制限（GOTRUE_RATE_LIMIT_HEADER）を逃れるのを防ぐため
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Prefix $forwarded_prefix;

  # rest と auth は CORS を自前で返す（auth は GOTRUE_CORS_ALLOWED_HEADERS で apikey を許可済み）
  location /rest/v1/    { proxy_pass http://rest/; }
  location /auth/v1/    { proxy_pass http://auth/; }

  # storage-api は CORS に応答しないので、ここで返す（公式構成ではゲートウェイの役目）。
  # admin のサムネイルアップロードがブラウザから直接ここを叩く
  location /storage/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin * always;
    proxy_pass http://storage/;
  }
}
