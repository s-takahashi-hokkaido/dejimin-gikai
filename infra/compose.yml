# Supabase 最小構成（db / auth / rest / storage）＋ ゲートウェイ代わりの nginx
#
# 手順: docs/20260922_1716_ローカルdocker-compose検証手順.md
# 公式の self-hosting 用 compose（supabase/supabase の docker/）から必要なものだけ残している。
# イメージの版は Supabase CLI（npx supabase start）が使っているものに揃えている（2026-09-22 時点）。
#
# 使い方:
#   cp .env.example .env   # 秘密情報を埋める
#   docker compose up -d

name: gikai-supabase

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    restart: unless-stopped
    ports:
      # マイグレーションと dump 用。外には出さない
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      # 2GB の VPS に載せるため絞る（方針 §5 のサイジング）
      - -c
      - shared_buffers=128MB
    volumes:
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:?}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:?}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
      # 以下は supabase/config.toml の [auth] と同じ値（config.toml は CLI しか読まない）
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 6
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: ${RATE_LIMIT_ANONYMOUS_USERS:-30}
      # レート制限を利用者の IP ごとに数えるためのヘッダー。nginx が $remote_addr で上書きして付ける
      GOTRUE_RATE_LIMIT_HEADER: X-Real-IP
      # supabase-js は apikey ヘッダーを付けて送るが、GoTrue の既定の許可リストに無いためプリフライトで弾かれる。
      # 公式構成ではゲートウェイ（Kong / Envoy）が CORS を返していた
      GOTRUE_CORS_ALLOWED_HEADERS: apikey
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      # config.toml の [api] max_rows と同じ。AI コストの集計はこれで打ち切られないよう DB 関数で行っている
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.72.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      # storage-api は IPv4 でしか待ち受けないので localhost（::1 に解決される）ではなく 127.0.0.1
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      ANON_KEY: ${ANON_KEY:?}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      # imgproxy を立てないので画像変換は切る
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ./volumes/storage:/var/lib/storage:z

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./nginx/supabase.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-config:
